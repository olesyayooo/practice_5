<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="1190" viewBox="0 0 1050 1190"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" font-size="16" fill="#111827"><text x="525" y="30" text-anchor="middle">Activity — Main и TimesheetAnalyzer, вариант 6</text><rect x="190" y="55" width="280" height="45" rx="8" fill="#f1f5f9" stroke="#334155"/><text x="330.0" y="80" text-anchor="middle">Начало и ввод строки</text><polyline points="330,100 330,120" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/><polygon points="330,120 510,165 330,210 150,165" fill="#eff6ff" stroke="#334155"/><text x="330" y="159" text-anchor="middle">Строка отсутствует</text><text x="330" y="180" text-anchor="middle">или пуста?</text><polyline points="330,210 330,235" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/><text x="355" y="227" text-anchor="middle">нет</text><rect x="140" y="235" width="380" height="65" rx="8" fill="#f1f5f9" stroke="#334155"/><text x="330.0" y="260" text-anchor="middle">split(&quot;;&quot;, -1)</text><text x="330.0" y="282" text-anchor="middle">Сохранить пустые поля</text><polyline points="330,300 330,320" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/><polygon points="330,320 510,365 330,410 150,365" fill="#eff6ff" stroke="#334155"/><text x="330" y="359" text-anchor="middle">Количество полей</text><text x="330" y="380" text-anchor="middle">равно 5?</text><polyline points="330,410 330,435" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/><text x="350" y="428" text-anchor="middle">да</text><rect x="215" y="435" width="230" height="45" rx="8" fill="#f1f5f9" stroke="#334155"/><text x="330.0" y="460" text-anchor="middle">i = 0</text><polyline points="330,480 330,505" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/><polygon points="330,505 510,550 330,595 150,550" fill="#eff6ff" stroke="#334155"/><text x="330" y="544" text-anchor="middle">i &lt; parts.length?</text><polyline points="330,595 330,625" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/><text x="350" y="615" text-anchor="middle">да</text><rect x="120" y="625" width="420" height="65" rx="8" fill="#f1f5f9" stroke="#334155"/><text x="330.0" y="650" text-anchor="middle">Убрать пробелы; проверить непустое поле</text><text x="330.0" y="672" text-anchor="middle">Преобразовать через Integer.parseInt</text><polyline points="330,690 330,710" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/><polygon points="330,710 510,755 330,800 150,755" fill="#eff6ff" stroke="#334155"/><text x="330" y="749" text-anchor="middle">Целое число</text><text x="330" y="770" text-anchor="middle">от 0 до 16?</text><polyline points="330,800 330,830" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/><text x="350" y="820" text-anchor="middle">да</text><rect x="160" y="830" width="340" height="65" rx="8" fill="#f1f5f9" stroke="#334155"/><text x="330.0" y="855" text-anchor="middle">Сохранить hours[i]</text><text x="330.0" y="877" text-anchor="middle">i = i + 1</text><polyline points="160,860 70,860 70,550 150,550" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="675" y="625" width="330" height="95" rx="8" fill="#f1f5f9" stroke="#334155"/><text x="840.0" y="650" text-anchor="middle">total(hours); average(hours)</text><text x="840.0" y="672" text-anchor="middle">overtimeDays(hours)</text><text x="840.0" y="694" text-anchor="middle">weeklyOvertime(hours)</text><polyline points="510,550 840,550 840,625" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/><text x="670" y="540" text-anchor="middle">нет</text><rect x="675" y="790" width="330" height="65" rx="8" fill="#f1f5f9" stroke="#334155"/><text x="840.0" y="815" text-anchor="middle">Вывести результаты</text><text x="840.0" y="837" text-anchor="middle">Конец</text><polyline points="840,720 840,790" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="675" y="960" width="330" height="90" rx="8" fill="#f1f5f9" stroke="#334155"/><text x="840.0" y="985" text-anchor="middle">Вывести ошибку с позицией</text><text x="840.0" y="1007" text-anchor="middle">Без расчёта показателей</text><text x="840.0" y="1029" text-anchor="middle">Конец</text><polyline points="510,165 1030,165 1030,1005 1005,1005" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/><text x="550" y="153" text-anchor="middle">да</text><polyline points="510,365 1015,365 1015,975 1005,975" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/><text x="550" y="353" text-anchor="middle">нет</text><polyline points="510,755 610,755 610,1005 675,1005" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/><text x="770" y="750" text-anchor="middle">нет / ошибка разбора</text><text x="525" y="1135" text-anchor="middle">Любое пустое поле или ошибка parseInt ведёт к сообщению ошибки.</text></g></svg>